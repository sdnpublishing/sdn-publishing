<script>const Q=[["You bought the expensive gym membership in January. It's June; you haven't been since March, but cancelling feels like admitting the money was wasted, so you keep paying.", ["Sunk cost fallacy", "Anchoring", "Halo effect"], 0, "The money is gone either way. Only future costs and benefits should decide — but the past spend keeps its grip."], ["The first flat you viewed was £1,400 a month. Every flat since has seemed like a bargain at £1,250, even though you'd budgeted £1,000.", ["Availability heuristic", "Anchoring", "Confirmation bias"], 1, "The first number set the scale. Everything after is judged against it rather than against your budget."], ["You believe your new manager is difficult. In the meeting she asks one sharp question; you barely notice the four times she agrees with you.", ["Confirmation bias", "Dunning–Kruger effect", "Loss aversion"], 0, "Evidence that fits the belief is noticed and remembered; evidence against it slides past."], ["After one plane crash in the news you decide to drive 300 miles rather than fly, though driving is statistically far more dangerous.", ["Availability heuristic", "Sunk cost fallacy", "Bandwagon effect"], 0, "Vivid, recent examples feel more likely than they are; the dull daily risk feels safer than it is."], ["You'd refuse a bet that pays £150 on heads and costs £100 on tails, even though the expected value is positive.", ["Framing effect", "Loss aversion", "Halo effect"], 1, "Losses loom larger than gains of the same size — most people need roughly two-to-one before a coin flip feels fair."], ["A surgeon describes the operation as having a 90% survival rate. Told it has a 10% mortality rate instead, more patients decline.", ["Framing effect", "Anchoring", "Status quo bias"], 0, "Same fact, different frame, different decision."], ["The attractive, well-spoken candidate is assumed to be competent before anyone has checked a single reference.", ["Halo effect", "Confirmation bias", "Availability heuristic"], 0, "One positive trait bleeds into unrelated judgements."], ["A colleague with two weeks' experience in the new software is certain the migration is simple. The developers who built it are worried.", ["Bandwagon effect", "Dunning–Kruger effect", "Sunk cost fallacy"], 1, "Not knowing enough to see the difficulty is itself the source of confidence."], ["You keep the default pension fund for eleven years, having never once looked at the alternatives.", ["Status quo bias", "Loss aversion", "Framing effect"], 0, "The current state is treated as safe by default; changing feels like a risk even when staying is one."], ["A book's rating jumps once it hits a bestseller list; readers who'd have shrugged now say it's 'obviously good'.", ["Bandwagon effect", "Halo effect", "Anchoring"], 0, "Popularity is read as evidence of quality, which produces more popularity."], ["Told the coffee was 'roasted in small batches', tasters rate it better than the identical coffee from the same bag.", ["Framing effect", "Confirmation bias", "Availability heuristic"], 0, "The description sets the expectation; the expectation shapes the taste."], ["After a bad forecast, you say you 'knew all along' the deal would fall through — though your emails from the time say otherwise.", ["Hindsight bias", "Sunk cost fallacy", "Status quo bias"], 0, "Once the outcome is known, it feels as though it was always going to happen."]];let order=[],i=0,score=0;const $=id=>document.getElementById(id);
function start(){order=Q.slice().sort(()=>Math.random()-.5);i=0;score=0;$('sc').textContent=0;$('end').innerHTML='';show()}
function show(){const q=order[i];$('rn').textContent=i+1;$('sc_t').textContent=q[0];$('fb').innerHTML='';const opts=q[1].map((o,k)=>[o,k]).sort(()=>Math.random()-.5);$('opts').innerHTML=opts.map(([o,k])=>`<button class="opt" onclick="pick(${k},this)">${o}</button>`).join('')}
function pick(k,btn){const q=order[i];document.querySelectorAll('.opt').forEach(b=>b.disabled=true);if(k===q[2]){score++;$('sc').textContent=score;btn.style.borderColor='var(--acc)'}else btn.style.opacity=.5;
$('fb').innerHTML=`<b>${q[1][q[2]]}.</b> ${q[3]} <button class="btn o" style="margin-left:.6rem" onclick="nxt()">${i<11?'Next':'Result'}</button>`}
function nxt(){i++;if(i<12)show();else $('end').innerHTML=`<p class="q">${score} of 12</p><p>${score>=10?'Hard to fool. Harder still to stay that way.':score>=7?'Better than most — the remaining ones are the interesting part.':'Everyone has these; the trick is knowing your own set.'}</p>${shareBtn('I spotted '+score+'/12 cognitive biases in Bias Spotter')}<p><button class="btn" onclick="start()">Play again</button></p>`}
start();</script>
