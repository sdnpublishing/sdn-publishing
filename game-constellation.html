tml"}, {"asin": "B0CL9BX51D", "t": "Interstellar Journeys", "a": "Campbell Quinn McCarthy", "c": "https://images-na.ssl-images-amazon.com/images/P/B0CL9BX51D.01._SL500_.jpg", "u": "https://www.amazon.co.uk/dp/B0CL9BX51D?tag=sdnpublishing-21", "p": "https://sdnpublishing.github.io/author-campbell-quinn-mccarthy/books/B0CL9BX51D.html"}, {"asin": "B0G1LCG7F9", "t": "Signal from Alcyone", "a": "Carey Lee James", "c": "https://images-na.ssl-images-amazon.com/images/P/B0G1LCG7F9.01._SL500_.jpg", "u": "https://www.amazon.co.uk/dp/B0G1LCG7F9?tag=sdnpublishing-21", "p": "https://sdnpublishing.github.io/author-carey-lee-james/books/B0G1LCG7F9.html"}, {"asin": "B0DGXVRT4B", "t": "Celestial Flames of the Starseed Ascension", "a": "Carey Lee James", "c": "https://images-na.ssl-images-amazon.com/images/P/B0DGXVRT4B.01._SL500_.jpg", "u": "https://www.amazon.co.uk/dp/B0DGXVRT4B?tag=sdnpublishing-21", "p": "https://sdnpublishing.github.io/author-carey-lee-james/books/B0DGXVRT4B.html"}];const _q=new URLSearchParams(location.search);const _pick=BOOKS.find(b=>b.asin===_q.get('asin'))||BOOKS[0];

<script>const P=[[90,120],[210,60],[330,150],[450,70],[580,130],[300,300],[520,290]],L=['Alcyone','Arcturus','Sirius','Vega','Mirach','Rigel','Antares'];const svg=document.getElementById('sky'),$=id=>document.getElementById(id);let seq=[],inp=[],busy=false,best=+(localStorage.getItem('sdn_stars_best')||0);$('best').textContent=best;
svg.innerHTML=`<polyline points="${P.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#9FA8D4" stroke-opacity=".25"/>`+P.map((p,i)=>`<g class="st" data-i="${i}" style="cursor:pointer"><circle cx="${p[0]}" cy="${p[1]}" r="22" fill="transparent"/><circle cx="${p[0]}" cy="${p[1]}" r="6" fill="#F3EFE6" id="s${i}"/><text x="${p[0]}" y="${p[1]+30}" fill="#9FA8D4" font-size="11" text-anchor="middle" font-family="Lato">${L[i]}</text></g>`).join('');
function lite(i,ms){return new Promise(r=>{const c=$('s'+i);c.setAttribute('r',15);c.setAttribute('fill','#6FD3E8');setTimeout(()=>{c.setAttribute('r',6);c.setAttribute('fill','#F3EFE6');setTimeout(r,180)},ms)})}
async function play(){busy=true;$('fb').textContent='Watch…';for(const i of seq)await lite(i,Math.max(260,600-seq.length*35));$('fb').textContent='Your turn';busy=false;inp=[]}
function start(){seq=[];$('end').innerHTML='';$('go').style.display='none';next()}
function next(){seq.push(Math.floor(Math.random()*7));$('rn').textContent=seq.length;play()}
svg.addEventListener('click',e=>{const g=e.target.closest('.st');if(!g||busy||!seq.length)return;const i=+g.dataset.i;lite(i,220);inp.push(i);const k=inp.length-1;if(inp[k]!==seq[k]){busy=true;const r=seq.length-1;if(r>best){best=r;localStorage.setItem('sdn_stars_best',best);$('best').textContent=best}$('fb').textContent='';$('end').innerHTML=`<p class="q">You held ${r} star${r===1?'':'s'}.</p><p>${r>=10?'That is a serious memory.':r>=6?'A good sky.':'The stars are patient. Try again.'}</p>${shareBtn('I held a sequence of '+r+' stars in Constellation Recall')}<p><button class="btn" onclick="start()">Again</button></p>`;return}if(inp.length===seq.length){busy=true;$('fb').textContent='Right.';setTimeout(next,700)}});</script>
