<script>const Q=[["Which plant, hung above a door in folklore, was said to keep out ill luck — and is also the key ingredient of a soothing tea?", ["Chamomile", "Rowan", "Nettle"], 1, "Rowan: the tree of protection across northern Europe, its berries strung as charms. (Chamomile is the tea — a fair guess.)"], ["Rosemary's traditional association is with:", ["Remembrance", "Love", "Sleep"], 0, "'Rosemary for remembrance' — Ophelia's line has a practical root: the scent was believed to sharpen memory."], ["Which of these is dangerous to handle without gloves, whatever the old books say about its magic?", ["Monkshood", "Lavender", "Sage"], 0, "Aconite, or monkshood — every part is toxic, including through skin. Respect for a plant includes leaving some alone."], ["A 'simple' in the old herbals is:", ["A single-herb remedy", "A beginner's charm", "A garden bed"], 0, "One plant, one purpose. Compound remedies came later; simples are where herb craft starts."], ["Which herb was strewn on floors and burned in medieval houses for its clean, sharp smell?", ["Mugwort", "Rue", "Meadowsweet"], 2, "Meadowsweet — strewing herb of choice, and, as it happens, a natural source of salicylic acid."], ["Mugwort is traditionally linked with:", ["Wealth", "Dreams and travel", "Fire"], 1, "Mugwort in the shoe for the traveller, under the pillow for dreams — one of the oldest recorded plant uses in Britain."], ["Foxglove gives medicine its digitalis. In the garden it should be treated as:", ["Edible in small amounts", "Safe once dried", "Poisonous throughout"], 2, "Every part, fresh or dried. Beautiful, historic and not for tea."], ["Which herb's folk name is 'all-heal'?", ["Valerian", "Thyme", "Yarrow"], 0, "Valerian, though yarrow also carries healer's names — it was the soldier's wound herb."], ["Elder trees were traditionally never cut without asking permission because:", ["The wood was worthless", "A spirit was believed to live in them", "They were royal property"], 1, "The Elder Mother: ask before you cut, or the luck goes with the branch."], ["Which of these is a plant of the 'green witch' hearth rather than the field?", ["Basil", "Heather", "Gorse"], 0, "Basil on the windowsill — protection, prosperity and, more usefully, dinner."], ["A poultice is:", ["A dried herb bundle", "A herb steeped in oil", "Crushed plant matter applied to the skin"], 2, "Fresh or softened plant material held against the body — the oldest external remedy there is."], ["Nettle stings, yet the plant is prized in herb craft for:", ["Nothing — it's a weed", "Food, fibre and iron-rich tea", "Cursing"], 1, "Cooked or dried it loses the sting and keeps the goodness; the fibre once made cloth."]];let order=[],i=0,score=0;const $=id=>document.getElementById(id);
function start(){order=Q.slice().sort(()=>Math.random()-.5);i=0;score=0;$('sc').textContent=0;$('end').innerHTML='';show()}
function show(){const q=order[i];$('rn').textContent=i+1;$('sc_t').textContent=q[0];$('fb').innerHTML='';const opts=q[1].map((o,k)=>[o,k]).sort(()=>Math.random()-.5);$('opts').innerHTML=opts.map(([o,k])=>`<button class="opt" onclick="pick(${k},this)">${o}</button>`).join('')}
function pick(k,btn){const q=order[i];document.querySelectorAll('.opt').forEach(b=>b.disabled=true);if(k===q[2]){score++;$('sc').textContent=score;btn.style.borderColor='var(--acc)'}else btn.style.opacity=.5;$('fb').innerHTML=`${q[3]} <button class="btn o" style="margin-left:.6rem" onclick="nxt()">${i<11?'Next':'Result'}</button>`}
function nxt(){i++;if(i<12)show();else $('end').innerHTML=`<p class="q">${score} of 12</p><p>${score>=10?'You could keep a stillroom.':score>=7?'A good hedge-witch start.':'The plants forgive beginners. The books help.'}</p>${shareBtn('I scored '+score+'/12 in Herb Lore')}<p><button class="btn" onclick="start()">Play again</button></p>`}
start();</script>
