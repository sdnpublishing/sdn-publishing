<script>const Q=[["A picture frame needs hanging on plasterboard where there's no stud.", ["A self-drilling plasterboard anchor", "A nail", "A screw straight into the board"], 0, "Plasterboard alone won't hold a screw; the anchor spreads the load. Find studs for anything heavy."], ["Water is dripping from under the kitchen sink. First move?", ["Turn off the isolation valve under the sink", "Wrap the pipe in tape", "Call a plumber immediately"], 0, "Stop the water, then look. Most drips are a compression joint or a trap nut you can tighten."], ["The downspout empties onto the path and the wall is getting damp.", ["A splash block or extension to carry water away from the foundation", "Ignore it — rain is normal", "Seal the wall with paint"], 0, "Water needs to land at least a metre from the wall. Sealing the wall traps the problem."], ["You want to cut a straight line in a sheet of plywood.", ["A circular saw with a clamped guide", "A hand saw freehand", "A jigsaw freehand"], 0, "The guide does the straightness; the saw just follows it."], ["The garage floor needs a new surface you'll park on.", ["Concrete with a proper cure time", "Wood boards", "Thin self-levelling compound alone"], 0, "Cars need the strength of a cured slab; levelling compound is for finishing, not structure."], ["Before drilling into a wall, you should:", ["Check for pipes and cables with a detector", "Drill a small test hole", "Tap to hear if it's hollow"], 0, "A detector costs less than one drilled cable."], ["A door has started sticking at the top corner in wet weather.", ["Plane a little off the sticking edge and seal it", "Force it", "Replace the door"], 0, "Timber swells; take off a millimetre and seal the bare wood so it stops taking on water."], ["You're installing a ceiling fan where a light was.", ["Check the box is fan-rated and turn off the circuit at the consumer unit", "Just switch off the light switch", "Use the existing box regardless"], 0, "Light boxes aren't built for a spinning
