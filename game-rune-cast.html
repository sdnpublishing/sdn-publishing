<style>:root{--bg:#0d0a14;--ink:#eee6d8;--mute:#a99bc0;--acc:#c8963e;--panel:#1c1030}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Lato,sans-serif;font-weight:300;line-height:1.5;min-height:100vh}

.stage{background:var(--panel);border-radius:6px;padding:1.2rem;min-height:200px}canvas.g{width:100%;display:block;border-radius:4px;touch-action:none}

.opt{display:block;width:100%;text-align:left;font:400 1rem Lato,sans-serif;color:var(--ink);background:rgba(127,127,127,.12);border:1px solid rgba(127,127,127,.35);border-radius:6px;padding:.75rem 1rem;margin:0 0 .5rem;cursor:pointer}.opt:hover{background:rgba(127,127,127,.22)}

<h1>Rune Cast</h1><p class="lede">Three runes from the Elder Futhark, laid past, present, what comes. Meanings are the traditional ones; what they mean for you is the part no page can do.</p><div class="stage"><div id="cast" style="display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;min-height:220px"></div><div style="text-align:center;margin-top:1rem"><button class="btn" onclick="cast()">Cast the runes</button> <button class="btn o" onclick="one()">Single rune</button></div><div class="fb" id="fb" style="text-align:center"></div></div>
<div class="book" id="bookpanel"></div><div class="others" id="others"></div>
<footer><a href="explore.html">More games and tools</a> · Published by <a href="index.html">SDN Publishing</a>. As an Amazon Associate, SDN Publishing earns from qualifying purchases.</footer></main>

B0CH2BKMM9.01._SL500_.jpg", "u": "https://www.amazon.co.uk/dp/B0CH2BKMM9?tag=sdnpublishing-21", "p": "https://sdnpublishing.github.io/author-d-r-t-stephens/books/B0CH2BKMM9.html"}, {"asin": "B0CLKZ1WVN", "t": "Petromancy", "a": "D.R. T STEPHENS", "c": "https://images-na.ssl-images-amazon.com/images/P/B0CLKZ1WVN.01._SL500_.jpg", "u": "https://www.amazon.co.uk/dp/B0CLKZ1WVN?tag=sdnpublishing-21", "p": "https://sdnpublishing.github.io/author-d-r-t-stephens/books/B0CLKZ1WVN.html"}, {"asin": "B0CPW8CKXG", "t": "Harnessing the Shadows", "a": "D.R. T STEPHENS", "c": "https://images-na.ssl-images-amazon.com/images/P/B0CPW8CKXG.01._SL500_.jpg", "u": "https://www.amazon.co.uk/dp/B0CPW8CKXG?tag=sdnpublishing-21", "p": "https://sdnpublishing.github.io/author-d-r-t-stephens/books/B0CPW8CKXG.html"}, {"asin": "B0D5WJVKC1", "t": "Astrological Pathways", "a": "Claire Haley Elder", "c": "https://images-na.ssl-images-amazon.com/images/P/B0D5WJVKC1.01._SL500_.jpg", "u": "https://www.amazon.co.uk/dp/B0D5WJVKC1?tag=sdnpublishing-21", "p": "https://sdnpublishing.github.io/author-claire-haley-elder/books/B0D5WJVKC1.html"}];const _q=new URLSearchParams(location.search);const _pick=BOOKS.find(b=>b.asin===_q.get('asin'))||BOOKS[0];
function bookPanel(b){b=b||_pick;document.getElementById('bookpanel').innerHTML=`<a href="${b.p}"><img src="${b.c}" alt="${b.t} cover" loading="lazy"></a><div><div style="font-size:.78rem;color:var(--mute)">The book behind this game</div><h2>${b.t}</h2><div class="a">${b.a}</div><a class="buy" href="${b.u}" target="_blank" rel="noopener">Get it on Amazon</a><a class="more" href="${b.p}">About the book</a></div>`;
document.getElementById('others').innerHTML=BOOKS.length>1?'Also in this world: '+BOOKS.filter(x=>x!==b).slice(0,6).map(x=>`<a href="${x.p}">${x.t}</a>`).join(' · '):''}
function shareBtn(txt){const u=location.href.split('?')[0]+(_q.get('asin')?'?asin='+_q.get('asin'):'');return `<div class="share"><button class="btn o" onclick="navigator.clipboard.writeText(${JSON.stringify(txt+' ')}+location.href);this.textContent='Link copied'">Share your score</button><a class="btn o" href="https://x.com/intent/tweet?text=${encodeURIComponent(txt)}&url=${encodeURIComponent(u)}" target="_blank" rel="noopener">Post on X</a></div>`}
bookPanel();</script>
<script>const R=[["ᚠ", "Fehu", "wealth, cattle, what you own and what owns you"], ["ᚢ", "Uruz", "strength, the wild ox, raw vitality"], ["ᚦ", "Thurisaz", "the thorn — conflict, a hard boundary, Thor's hammer"], ["ᚨ", "Ansuz", "a message, breath, the god who speaks"], ["ᚱ", "Raidho", "the journey, the wheel, right order"], ["ᚲ", "Kenaz", "the torch — knowledge, craft, a fire you can carry"], ["ᚷ", "Gebo", "the gift, exchange, a partnership with obligations"], ["ᚹ", "Wunjo", "joy, fellowship, things going well"], ["ᚺ", "Hagalaz", "hail — disruption you did not choose"], ["ᚾ", "Nauthiz", "need, constraint, the fire made from friction"], ["ᛁ", "Isa", "ice — stillness, delay, what will not move yet"], ["ᛃ", "Jera", "harvest, the year, reward in its season"], ["ᛇ", "Eihwaz", "the yew — endurance, the axis between worlds"], ["ᛈ", "Perthro", "the lot-cup — chance, mystery, what is hidden"], ["ᛉ", "Algiz", "the elk — protection, a raised guard"], ["ᛊ", "Sowilo", "the sun — success, clarity, direction"], ["ᛏ", "Tiwaz", "Tyr's rune — justice, sacrifice, the honest fight"], ["ᛒ", "Berkano", "the birch — growth, birth, beginnings"], ["ᛖ", "Ehwaz", "the horse — trust, movement, partnership"], ["ᛗ", "Mannaz", "humankind, the self among others"], ["ᛚ", "Laguz", "water — flow, intuition, the unconscious"], ["ᛜ", "Ingwaz", "the seed — potential held, completion coming"], ["ᛞ", "Dagaz", "day — breakthrough, the moment of change"], ["ᛟ", "Othala", "inheritance, home, what is passed down"]],POS=['Past','Present','What comes'];const $=id=>document.getElementById(id);
function card(r,pos,rev){return `<div style="background:#0d0a14;border:1px solid #3a2a52;border-radius:6px;padding:1rem .6rem;text-align:center"><div style="font-size:.75rem;color:var(--mute)">${pos}</div><div style="font-size:3.4rem;line-height:1.2;color:var(--acc);transform:rotate(${rev?180:0}deg);display:inline-block">${r[0]}</div><div style="font-family:Cinzel,serif;font-size:1.05rem">${r[1]}${rev?' (reversed)':''}</div><div style="font-size:.85rem;color:var(--mute);margin-top:.3rem">${r[2]}</div></div>`}
function draw(n){const d=R.slice().sort(()=>Math.random()-.5).slice(0,n).map(r=>[r,Math.random()<.3&&!['ᚷ','ᚺ','ᛁ','ᛃ','ᛇ','ᛊ','ᛜ','ᛞ'].includes(r[0])]);return d}
function cast(){const d=draw(3);$('cast').innerHTML=d.map((x,i)=>card(x[0],POS[i],x[1])).join('');$('fb').innerHTML=shareBtn('My rune cast: '+d.map(x=>x[0][1]).join(', '))}
function one(){const d=draw(1);$('cast').innerHTML='<div></div>'+card(d[0][0],'Today',d[0][1])+'<div></div>';$('fb').innerHTML=shareBtn('My rune today: '+d[0][0][1])}
cast();</script>
<script>(function(){var C='https://raw.githubusercontent.com/sdnpublishing/sdn-publishing/main/newsletter.json';function rw(go){document.querySelectorAll('a[href*="amazon.co.uk"]').forEach(function(a){if(a.dataset.geo)return;var h=a.getAttribute('href');var m=h.match(/\/dp\/([A-Z0-9]{10})/),s=h.match(/[?&]k=(\d{13})/);if(m)a.href=go+'/go/'+m[1]+'?src=game';else if(s)a.href=go+'/go/isbn/'+s[1]+'?src=game';else return;a.dataset.geo='1';});}fetch(C,{cache:'no-store'}).then(function(r){return r.json()}).then(function(c){if(!c||!c.go)return;var go=c.go.replace(/\/$/,'');rw(go);setTimeout(function(){rw(go)},1500);setTimeout(function(){rw(go)},4000);}).catch(function(){});})();</script></body></html>
