<style>:root{--bg:#140805;--ink:#f3e9dc;--mute:#c9a98c;--acc:#c8963e;--panel:#33150c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Lato,sans-serif;font-weight:300;line-height:1.5;min-height:100vh}

, "a": "Jake Stanley Brown", "c": "https://images-na.ssl-images-amazon.com/images/P/B0DQVCXFMK.01._SL500_.jpg", "u": "https://www.amazon.co.uk/dp/B0DQVCXFMK?tag=sdnpublishing-21", "p": "https://sdnpublishing.github.io/author-jake-stanley-brown/books/B0DQVCXFMK.html"}, {"asin": "B0HB8XS826", "t": "Light That Belongs", "a": "Rowan V. Kersey", "c": "https://images-na.ssl-images-amazon.com/images/P/B0HB8XS826.01._SL500_.jpg", "u": "https://www.amazon.co.uk/dp/B0HB8XS826?tag=sdnpublishing-21", "p": "https://sdnpublishing.github.io/author-rowan-v-kersey/books/B0HB8XS826.html"}, {"asin": "B0CWFD77NT", "t": "A Concise Introduction To Cinematics In Games", "a": "Jake Stanley Brown", "c": "https://images-na.ssl-images-amazon.com/images/P/B0CWFD77NT.01._SL500_.jpg", "u": "https://www.amazon.co.uk/dp/B0CWFD77NT?tag=sdnpublishing-21", "p": "https://sdnpublishing.github.io/author-jake-stanley-brown/books/B0CWFD77NT.html"}, {"asin": "B0HBD1M6DT", "t": "Signal Before Style", "a": "Rowan V. Kersey", "c": "https://images-na.ssl-images-amazon.com/images/P/B0HBD1M6DT.01._SL500_.jpg", "u": "https://www.amazon.co.uk/dp/B0HBD1M6DT?tag=sdnpublishing-21", "p": "https://sdnpublishing.github.io/author-rowan-v-kersey/books/B0HBD1M6DT.html"}, {"asin": "B0HBLT52D8", "t": "The Unrepeatable Frame", "a": "Rowan V. Kersey", "c": "https://images-na.ssl-images-amazon.com/images/P/B0HBLT52D8.01._SL500_.jpg", "u": "https://www.amazon.co.uk/dp/B0HBLT52D8?tag=sdnpublishing-21", "p": "https://sdnpublishing.github.io/author-rowan-v-kersey/books/B0HBLT52D8.html"}, {"asin": "B0GZKRB7RX", "t": "The Cinematographer's Story Map", "a": "Eddy Walter Clarke", "c": "https://images-na.ssl-images-amazon.com/images/P/B0GZKRB7RX.01._SL500_.jpg", "u": "https://www.amazon.co.uk/dp/B0GZKRB7RX?tag=sdnpublishing-21", "p": "https://sdnpublishing.github.io/author-eddy-walter-clarke/books/B0GZKRB7RX.html"}, {"asin": "B0HBLQCR2H", "t": "Tabletop in Motion", "a": "Rowan V. Kersey", "c": "https://images-na.ssl-images-amazon.com/images/P/B0HBLQCR2H.01._SL500_.jpg", "u": "https://www.amazon.co.uk/dp/B0HBLQCR2H?tag=sdnpublishing-21", "p": "https://sdnpublishing.github.io/author-rowan-v-kersey/books/B0HBLQCR2H.html"}];const _q=new URLSearchParams(location.search);const _pick=BOOKS.find(b=>b.asin===_q.get('asin'))||BOOKS[0];
function bookPanel(b){b=b||_pick;document.getElementById('bookpanel').innerHTML=`<a href="${b.p}"><img src="${b.c}" alt="${b.t} cover" loading="lazy"></a><div><div style="font-size:.78rem;color:var(--mute)">The book behind this game</div><h2>${b.t}</h2><div class="a">${b.a}</div><a class="buy" href="${b.u}" target="_blank" rel="noopener">Get it on Amazon</a><a class="more" href="${b.p}">About the book</a></div>`;

function shareBtn(txt){const u=location.href.split('?')[0]+(_q.get('asin')?'?asin='+_q.get('asin'):'');return `<div class="share"><button class="btn o" onclick="navigator.clipboard.writeText(${JSON.stringify(txt+' ')}+location.href);this.textContent='Link copied'">Share your score</button><a class="btn o" href="https://x.com/intent/tweet?text=${encodeURIComponent(txt)}&url=${encodeURIComponent(u)}" target="_blank" rel="noopener">Post on X</a></div>`}

<script>const Q=[["She reads the letter that changes everything. We must see it land on her face.", ["Close-up", "Wide shot", "High angle"], 0, "The face is the scene; nothing else should compete."], ["Two negotiators face off across a table; we need to feel the space between them.", ["Two-shot, profile", "Extreme close-up", "Dutch angle"], 0, "Both in frame, the gap visible — the distance is the drama."], ["The stranger arrives in a town that doesn't want him. Establish where we are and how small he is in it.", ["Extreme wide shot", "Close-up", "Over-the-shoulder"], 0, "Scale and place first; the person can be tiny in it."], ["The villain rises to speak; the room should feel his power before he says a word.", ["Low angle", "High angle", "Insert"], 0, "Camera below the eyeline makes the subject loom."], ["The detective spots the one detail everyone else missed — a scratch on a ring.", ["Insert", "Wide shot", "Two-shot"], 0, "A cutaway to the object itself; the audience must see exactly what she sees."], ["The child is lost in the crowd. We should feel her vulnerability.", ["High angle", "Low angle", "Whip pan"], 0, "Looking down diminishes; the crowd becomes a sea."], ["A conversation where we need to stay with the listener's reaction, not the speaker.", ["Over-the-shoulder on the listener", "Wide shot", "Extreme close-up on the speaker"], 0, "Speaker's shoulder in frame, listener's face carrying the beat."], ["The world tilts — a drugged glass, a betrayal realised. The frame itself should feel wrong.", ["Dutch angle", "Insert", "Two-shot"], 0, "A canted horizon reads as unease without a word."], ["A long walk down a corridor where dread builds and nothing yet happens.", ["Slow dolly / tracking shot", "Static wide", "Rapid cuts"], 0, "Movement without event; time is the tension."], ["Two people who cannot admit they love each other, standing too close in a doorway.", ["Tight two-shot", "Extreme wide", "High angle"], 0, "Proximity in the frame says what the dialogue won't."], ["The reveal of the hidden room. The audience should discover it at the pace the character does.", ["Slow pan following her eyeline", "Jump cut", "Insert"], 0, "The camera moves with her looking; discovery shared."], ["Chaos in the kitchen at service — six things happening at once.", ["Handheld with rapid cutting", "Locked-off wide", "Slow zoom"], 0, "Instability and speed match the content."]];let order=[],i=0,score=0;const $=id=>document.getElementById(id);
function start(){order=Q.slice().sort(()=>Math.random()-.5).slice(0,12);i=0;score=0;$('sc').textContent=0;$('end').innerHTML='';show()}
function show(){const q=order[i];$('rn').textContent=i+1;$('sc_t').textContent=q[0];$('fb').innerHTML='';const opts=q[1].map((o,k)=>[o,k]).sort(()=>Math.random()-.5);$('opts').innerHTML=opts.map(([o,k])=>`<button class="opt" onclick="pick(${k},this)">${o}</button>`).join('')}
function pick(k,btn){const q=order[i];document.querySelectorAll('.opt').forEach(b=>b.disabled=true);if(k===q[2]){score++;$('sc').textContent=score;btn.style.borderColor='var(--acc)'}else btn.style.opacity=.5;$('fb').innerHTML=`<b>${q[1][q[2]]}.</b> ${q[3]} <button class="btn o" style="margin-left:.6rem" onclick="nxt()">${i<order.length-1?'Next':'Result'}</button>`}
function nxt(){i++;if(i<order.length)show();else $('end').innerHTML=`<p class="q">${score} of ${order.length}</p><p>${score>=10?"You'd shoot it. Now light it.":score>=7?"Good instincts; the books argue the rest.":"Every shot is a decision \u2014 that's the whole discipline."}</p>${shareBtn('I scored '+score+'/'+order.length+' in Shot List')}<p><button class="btn" onclick="start()">Play again</button></p>`}
start();</script>
<script>(function(){var C='https://raw.githubusercontent.com/sdnpublishing/sdn-publishing/main/newsletter.json';function rw(go){document.querySelectorAll('a[href*="amazon.co.uk"]').forEach(function(a){if(a.dataset.geo)return;var h=a.getAttribute('href');var m=h.match(/\/dp\/([A-Z0-9]{10})/),s=h.match(/[?&]k=(\d{13})/);if(m)a.href=go+'/go/'+m[1]+'?src=game';else if(s)a.href=go+'/go/isbn/'+s[1]+'?src=game';else return;a.dataset.geo='1';});}fetch(C,{cache:'no-store'}).then(function(r){return r.json()}).then(function(c){if(!c||!c.go)return;var go=c.go.replace(/\/$/,'');rw(go);setTimeout(function(){rw(go)},1500);setTimeout(function(){rw(go)},4000);}).catch(function(){});})();</script></body></html>
